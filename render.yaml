services:
  - type: web
    name: linearcard-api
    runtime: node
    plan: free
    branch: master
    buildCommand: npm install && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /
    envVars: &envVars
      - key: NODE_VERSION
        value: "20"
      - key: JWT_SECRET
        sync: false
      - key: WALLET_CREDENTIALS_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: ISSUER_ID
        sync: false
      - key: GOOGLE_CLIENT_EMAIL
        sync: false
      - key: GOOGLE_PRIVATE_KEY
        sync: false
      - key: WAHA_BASE_URL
        sync: false
      - key: WAHA_API_KEY
        sync: false
      - key: WAHA_SESSION
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: NEXT_PUBLIC_BASE_URL
        sync: false
      - key: NEXT_PUBLIC_API_URL
        sync: false
      - key: WALLET_ENV_PREFIX
        sync: false # "none" on prod, "dev" on staging

  - type: web
    name: linearcard-api-dev
    runtime: node
    plan: free
    branch: DEV
    buildCommand: npm install && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /
    envVars: *envVars
